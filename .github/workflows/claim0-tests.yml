name: Claim-0 tests

# Sketch gate only. Does not replace operator-owned security_pipeline.yml.
# Passing this workflow is not a security-efficacy or production claim.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cargo-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test --locked
        run: cargo test --locked
