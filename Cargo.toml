[package]
name = "vigil-esa"
version = "0.1.0"
edition = "2021"
description = "VigilE.S.A. Enhanced Security — Claim-0 runnable architecture sketch (mock demos only)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/beyond-repair/VigilE.S.A.-Enhanced-Security"
keywords = ["security", "sketch", "claim-0"]
categories = ["command-line-utilities"]

[[bin]]
name = "vigil-esa"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
